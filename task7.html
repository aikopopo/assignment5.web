<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="task7.js" defer></script>

</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <span class="navbar-brand fs-3 fw-bold">Calculator</span>

            <ul class="navbar-nav flex-row gap-3">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Task 0</a>
                </li>
                <li class="nav-item">
                    <a href="task1.html" class="nav-link">Task 1</a>
                </li>
                <li class="nav-item">
                    <a href="task2.html" class="nav-link">Task 2</a>
                </li>
                <li class="nav-item">
                    <a href="task3.html" class="nav-link">Task 3</a>
                </li>
                <li class="nav-item">
                    <a href="task4.html" class="nav-link">Task 4</a>
                </li>
                <li class="nav-item">
                    <a href="task5.html" class="nav-link">Task 5</a>
                </li>
                <li class="nav-item">
                    <a href="task6.html" class="nav-link">Task 6</a>
                </li>
                <li class="nav-item">
                    <a href="task7.html" class="nav-link">Task 7</a>
                </li>
                <li class="nav-item">
                    <a href="task8.html" class="nav-link">Task 8</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="pt-3">
        <div class="d-flex justify-content-center gap-3">
            <div class="p-3 bg-secondary text-white">
                <div>
                    <label for="numb1" class="form-label">First Number</label>
                    <input type="number" id="numb1" class="form-control">
                </div>

                <div class="mt-3">
                    <label for="oper" class="form-label">Operation</label>
                    <select name="operation" id="oper" class="form-select">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                        <option value="/">/</option>
                    </select>
                </div>

                <div class="mt-3">
                    <label for="numb2" class="form-label">Second Number</label>
                    <input type="number" id="numb2" class="form-control">
                </div>

                <div class="mt-3 d-flex justify-content-center">
                    <button type="button" id="btn1" class="btn btn-primary">Calculate</button>
                </div>

                <div id="result" class="mt-3">
                    <p id="res">Result:</p>
                </div>
                
            </div>
        </div>
    </div>
</body>

</html>
