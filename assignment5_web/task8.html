        <div class="container">
            <div class="row g-5">
                <div class="col-md-6">
                    <h5 class="fw-bold mb-3">To-do list</h5>
                    <div id="taskList"></div>
                </div>
 
                <div class="col-md-6">
                    <h5 class="fw-bold mb-3">Add new task</h5>
                    <div class="form-panel">
                        <label for="titleInput" class="field-label">* Title</label>
                        <input type="text" id="titleInput" class="field-input mb-3">
 
                        <label for="descInput" class="field-label">* Description</label>
                        <textarea id="descInput" class="field-input field-textarea mb-2"></textarea>
 
                        <p id="errorMsg" class="text-danger small mb-2"></p>
 
                        <button type="button" id="addBtn" class="add-btn">Add task</button>
                    </div>
                </div>
            </div>
